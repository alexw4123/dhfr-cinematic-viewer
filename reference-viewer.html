<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DHFR · Atomic and secondary structure</title><style>
*{box-sizing:border-box}body{margin:0;background:#040d17;color:#d5eaf0;font:12px 'Segoe UI',sans-serif}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 22px;border-bottom:1px solid #233c4d}select,button{font:inherit;color:#c4e9f1;background:#102534;border:1px solid #355a6b;border-radius:4px;padding:9px 14px;cursor:pointer}button[aria-pressed=true]{background:#1b4956;border-color:#65cbd7}button:focus-visible,select:focus-visible{outline:2px solid #91f2f8;outline-offset:3px}#viewport{height:calc(100svh - 135px);min-height:350px;width:100%}footer{font-size:10px;color:#7899aa;padding:12px 22px;line-height:1.7}header span{margin-right:auto;font-size:10px;letter-spacing:1.2px}#status{margin:0;color:#a6ccd5}select{max-width:180px}@media(max-width:600px){header{gap:7px;padding:12px}button,select{font-size:10px;padding:8px}header span{width:100%}#viewport{height:calc(100svh - 160px)}footer{padding:10px 12px}}
</style></head><body><header><span>ACTUAL DHFR PREPARATION MODELS</span><select id="model" aria-label="Candidate model"><option value="gs">GS–Phe–Glu</option><option value="isog">isog–Phe–Glu</option></select><button id="secondary" aria-pressed="true">Secondary structure</button><button id="atomic" aria-pressed="false">Atomic detail</button><button id="isolate" aria-pressed="false">Isolate protein</button><button id="reset">Reset view</button></header><div id="viewport" aria-label="Interactive DHFR molecular model"></div><footer><p id="status">Loading source coordinates…</p><span>Prepared, unrelaxed models. Source coordinates unchanged; PSF-recorded connectivity added for display. No validated binding, inhibition or DHFR trajectory.</span></footer><script src="assets/ngl.js"></script><script>
const stage=new NGL.Stage('viewport',{backgroundColor:'#040d17',quality:'medium'});let component,atomic=false,isolated=false,token=0;
const byId=id=>document.getElementById(id);byId('model').value=new URLSearchParams(location.search).get('candidate')==='isog'?'isog':'gs';
function representations(){if(!component)return;component.removeAllRepresentations();const protein='@'+Array.from({length:3013},(_,i)=>i).join(',');if(atomic)component.addRepresentation('ball+stick',{sele:protein,color:'#62cddc',aspectRatio:1.5,radiusScale:.22});else component.addRepresentation('cartoon',{sele:protein,color:'#62cddc',smoothSheet:true});if(!isolated){component.addRepresentation('ball+stick',{sele:'@'+Array.from({length:74},(_,i)=>3013+i).join(','),color:'#efb95e',aspectRatio:1.5});component.addRepresentation('ball+stick',{sele:'@'+Array.from({length:66},(_,i)=>3087+i).join(','),color:'#bd9af1',aspectRatio:1.5});}byId('atomic').setAttribute('aria-pressed',String(atomic));byId('secondary').setAttribute('aria-pressed',String(!atomic));byId('isolate').setAttribute('aria-pressed',String(isolated));}
async function load(){const current=++token;byId('status').textContent='Loading actual source model…';const candidate=byId('model').value;try{const next=await stage.loadFile('assets/dhfr-'+candidate+'-connected.pdb',{defaultRepresentation:false});if(current!==token){stage.removeComponent(next);return;}if(component)stage.removeComponent(component);component=next;representations();component.autoView(0);byId('status').textContent=(candidate==='gs'?'GS–Phe–Glu':'isog–Phe–Glu')+' · 3,153 source-coordinate atoms · drag to rotate, scroll to zoom.';}catch(error){byId('status').textContent='Could not load source structure: '+error.message;}}
byId('model').onchange=load;byId('atomic').onclick=()=>{atomic=true;representations();};byId('secondary').onclick=()=>{atomic=false;representations();};byId('isolate').onclick=()=>{isolated=!isolated;representations();};byId('reset').onclick=()=>component&&component.autoView(0);window.addEventListener('resize',()=>stage.handleResize());load();
</script></body></html>
