name: Publish DHFR research page
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare DHFR research page
        run: |
          mkdir -p _site/assets
          unzip -q assets.zip -d _site
          cp index.html research-v6.css app.js research-sections.js molecule-engine.js content.js application-data.js site-config.js README.md .nojekyll ASSET-MANIFEST.json _site/
          cp assets/selection-maps.v1.compact.json assets/share-card.jpg assets/dhfr-surface-source.png _site/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy DHFR research page
        id: deployment
        uses: actions/deploy-pages@v4
